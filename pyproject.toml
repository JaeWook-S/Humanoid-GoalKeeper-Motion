[project]
name = "goalkeeper-mjlab"
version = "0.2.0"
description = "Booster K1 goalkeeper scene, motor control, random shots and simulation validation"
readme = "docs/구현3단계.md"
requires-python = ">=3.13,<3.14"
# 화면·검증·학습이 같은 MJLab 모터 구현을 실행하므로 이제 선택 의존성이 아니다.
dependencies = ["numpy>=2.0", "mujoco>=3.4", "mjlab @ git+https://github.com/mujocolab/mjlab.git@b517e0c489139e7fcee95702cfb2b01931264985"]

[project.scripts]
goalkeeper-inspect = "goalkeeper_mjlab.scripts.inspect_scene:main"

[build-system]
requires = ["uv_build>=0.9.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# 소스 배포본에도 실행 진입점·단계별 설명·검사 코드를 함께 넣어 재현할 수 있게 한다.
source-include = ["main.py", "docs/**", "tests/**"]

